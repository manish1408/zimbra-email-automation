<div class="mailbox-select" [class.open]="open" [class.disabled]="disabled">
  <button
    type="button"
    class="mailbox-select-toggle form-select form-select-sm"
    [disabled]="disabled"
    [attr.aria-expanded]="open"
    aria-haspopup="listbox"
    (click)="toggle()"
    (keydown)="onKeydown($event)"
  >
    <span class="mailbox-select-label" [class.placeholder]="!value && !emptyLabel">
      {{ selectedLabel }}
    </span>
  </button>

  @if (open) {
    <div class="mailbox-select-menu shadow-sm" role="listbox">
      <div class="mailbox-select-search">
        <input
          #searchInput
          type="search"
          class="form-control form-control-sm"
          [placeholder]="placeholder"
          [(ngModel)]="query"
          (ngModelChange)="onQueryChange()"
          (keydown)="onKeydown($event)"
          (click)="$event.stopPropagation()"
        />
      </div>
      <div class="mailbox-select-options">
        @for (option of filteredOptions; track option.value + option.label; let i = $index) {
          <button
            type="button"
            class="mailbox-select-option"
            role="option"
            [class.active]="i === highlightIndex"
            [class.selected]="option.value === value"
            (mousedown)="select(option.value)"
          >
            {{ option.label }}
          </button>
        } @empty {
          <div class="mailbox-select-empty text-muted">No mailboxes match</div>
        }
      </div>
    </div>
  }
</div>
